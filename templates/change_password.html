{% extends "base.html" %}
{% block title %}Change password - Secure Cloud Storage{% endblock %}
{% block content %}
<section class="card auth-card">
  <h2>Change password</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">Current password
      <input type="password" name="current" required autocomplete="current-password">
    </label>
    <label class="field">New password <span class="hint">min {{ min_len }} characters</span>
      <span class="input-row">
        <input type="password" id="pw" name="new" required minlength="{{ min_len }}"
               autocomplete="new-password" data-strength="meter">
        <button type="button" class="btn ghost sm" data-reveal="pw,pw2">Show</button>
      </span>
      <span class="strength" id="meter" data-level="-1"><span></span><small></small></span>
    </label>
    <label class="field">Confirm new password
      <input type="password" id="pw2" name="confirm" required minlength="{{ min_len }}" autocomplete="new-password">
    </label>
    <button type="submit" class="btn primary block">Update password</button>
  </form>
  <p class="muted center"><a href="{{ url_for('dashboard') }}">&larr; Back to files</a></p>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='auth.js') }}"></script>{% endblock %}
